<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 600 153" role="img" aria-labelledby="title"><title id="title">연구실 구성원은 안전교육을 받은 사람 집합 안에 있고, 빨간 출입증 집합은 안전교육 집합과 겹치지 않습니다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="40" y="45" width="310" height="150" rx="12" fill="#f7f8fa" stroke="#d8dbe0" stroke-width="1.5"/><text x="195" y="77" font-size="17" fill="#111" text-anchor="middle">안전교육 받은 사람</text><rect x="75" y="106" width="240" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="195" y="145" font-size="18" fill="#111" text-anchor="middle">연구실 구성원</text><rect x="395" y="71" width="170" height="105" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="480" y="114" font-size="17" fill="#111" text-anchor="middle">빨간 출입증</text><text x="480" y="141" font-size="17" fill="#111" text-anchor="middle">소지자</text><path d="M367 100L379 152" fill="none" stroke="#666970" stroke-width="2"/><path d="M379 100L367 152" fill="none" stroke="#666970" stroke-width="2"/></g></svg>
