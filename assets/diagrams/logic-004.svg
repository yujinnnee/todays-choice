<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 17 600 178" role="img" aria-labelledby="title"><title id="title">정확히 두 프로젝트를 선택합니다. A 선택 시 B 필요, D 선택 시 A 필요, C와 B 동시 선택 불가.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="300" y="30" font-size="15" fill="#111" text-anchor="middle">정확히 두 개 선택</text><rect x="60" y="57" width="100" height="55" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="110" y="92" font-size="24" fill="#111" text-anchor="middle">A</text><path d="M175 84L245 84" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="57" width="100" height="55" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="310" y="92" font-size="24" fill="#111" text-anchor="middle">B</text><text x="428" y="90" font-size="16" fill="#111" text-anchor="middle">C와 B 동시 선택 ×</text><rect x="60" y="138" width="100" height="55" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="110" y="173" font-size="24" fill="#111" text-anchor="middle">D</text><path d="M175 165L245 165" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><rect x="260" y="138" width="100" height="55" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="310" y="173" font-size="24" fill="#111" text-anchor="middle">A</text></g></svg>
