<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 35 600 285" role="img" aria-labelledby="title"><title id="title">8×8 종이의 접는 선 x=4와 y=4, 왼쪽에서 오른쪽 및 아래에서 위쪽으로 접는 화살표. 남는 오른쪽 위 영역의 구멍 6,7 한 개만 표시.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="120" y="42" width="248" height="248" rx="0" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><rect x="244" y="42" width="124" height="124" rx="0" fill="#f1f3f6" stroke="#d8dbe0" stroke-width="1.5"/><path d="M244 290L244 42" fill="none" stroke="#666970" stroke-width="2" stroke-dasharray="5 5"/><path d="M120 166L368 166" fill="none" stroke="#666970" stroke-width="2" stroke-dasharray="5 5"/><path d="M151 104L225.39999999999998 104" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><path d="M306 259L306 184.60000000000002" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><circle cx="306" cy="73" r="5" fill="#ff5c7a"/><text x="321" y="61" font-size="14" fill="#111" text-anchor="start">(6,7)</text><text x="120" y="315" font-size="14" fill="#111" text-anchor="middle">0</text><text x="244" y="315" font-size="14" fill="#111" text-anchor="middle">4</text><text x="368" y="315" font-size="14" fill="#111" text-anchor="middle">8</text><text x="98" y="47" font-size="14" fill="#111" text-anchor="middle">8</text><text x="98" y="171" font-size="14" fill="#111" text-anchor="middle">4</text><text x="424" y="165" font-size="14" fill="#111" text-anchor="middle">① 왼쪽 → 오른쪽</text><text x="424" y="195" font-size="14" fill="#111" text-anchor="middle">② 아래 → 위</text></g></svg>
