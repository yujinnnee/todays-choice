<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 89 600 176" role="img" aria-labelledby="title"><title id="title">북쪽을 보고 출발한 뒤 동쪽 3칸, 북쪽 2칸, 서쪽 5칸의 꺾인 이동 경로. 출발점과 마지막 위치 표시.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><path d="M225 229L375 229" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><path d="M375 229L375 129" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><path d="M375 129L125 129" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><circle cx="225" cy="229" r="4" fill="#202124"/><text x="225" y="260" font-size="16" fill="#111" text-anchor="middle">출발</text><circle cx="125" cy="129" r="6" fill="#ff5c7a"/><text x="125" y="106" font-size="15" fill="#111" text-anchor="middle">마지막 위치</text><text x="299" y="257" font-size="14" fill="#111" text-anchor="middle">① 오른쪽 전환 · 3칸</text><text x="456" y="186" font-size="14" fill="#111" text-anchor="middle">② 왼쪽 전환</text><text x="456" y="210" font-size="14" fill="#111" text-anchor="middle">2칸</text><text x="268" y="102" font-size="14" fill="#111" text-anchor="middle">③ 왼쪽 전환 · 5칸</text><path d="M57 209L57 162" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><text x="57" y="147" font-size="15" fill="#111" text-anchor="middle">북</text></g></svg>
