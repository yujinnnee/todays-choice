<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 39 600 130" role="img" aria-labelledby="title"><title id="title">정가에서 20% 할인하고 할인 금액에 세금 10%를 더한 최종 결제액은 88,000원입니다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="32" y="40" width="145" height="86" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="104.5" y="68" font-size="14" fill="#111" text-anchor="middle">세전 정가</text><text x="104.5" y="100" font-size="22" fill="#111" text-anchor="middle">? 원</text><path d="M186 83L229 83" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><rect x="237" y="40" width="145" height="86" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="309.5" y="68" font-size="14" fill="#111" text-anchor="middle">할인 후 금액</text><text x="309.5" y="100" font-size="22" fill="#111" text-anchor="middle">20% 할인</text><path d="M392 83L435 83" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><rect x="443" y="40" width="125" height="86" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="505.5" y="68" font-size="14" fill="#111" text-anchor="middle">결제액</text><text x="505.5" y="100" font-size="22" fill="#111" text-anchor="middle">88,000원</text><text x="414" y="58" font-size="13" fill="#111" text-anchor="middle">세금</text><text x="414" y="116" font-size="13" fill="#111" text-anchor="middle">+10%</text><text x="300" y="165" font-size="16" fill="#111" text-anchor="middle">할인 → 할인된 금액에 세금 적용</text></g></svg>
