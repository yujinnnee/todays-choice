<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 17 600 136" role="img" aria-labelledby="title"><title id="title">P, Q, R 세 스위치. P와 Q 중 정확히 하나 켜짐, P가 켜지면 R, R가 켜지면 Q도 켜짐.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="300" y="30" font-size="15" fill="#111" text-anchor="middle">P와 Q 중 정확히 하나만 켜짐</text><rect x="164" y="52" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="206" y="93" font-size="25" fill="#111" text-anchor="middle">P</text><rect x="258" y="52" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="300" y="93" font-size="25" fill="#111" text-anchor="middle">Q</text><rect x="352" y="52" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="394" y="93" font-size="25" fill="#111" text-anchor="middle">R</text><text x="300" y="148" font-size="16" fill="#111" text-anchor="middle">P 켜짐 → R 켜짐     /     R 켜짐 → Q 켜짐</text></g></svg>
