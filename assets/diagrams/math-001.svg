<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 65 600 134" role="img" aria-labelledby="title"><title id="title">10% 소금물 300g과 25% 소금물 미지의 양을 섞어 16% 소금물을 만드는 도식.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><path d="M46 66v80q0 12 12 12h72q12 0 12-12V66" fill="#fff" stroke="#202124" stroke-width="2"/><rect x="51" y="112" width="86" height="39" rx="3" fill="#f5f6f8" stroke="none" stroke-width="1.5"/><text x="94" y="96" font-size="23" fill="#111" text-anchor="middle">10%</text><text x="94" y="141" font-size="17" fill="#111" text-anchor="middle">300g</text><text x="169" y="118" font-size="25" fill="#111" text-anchor="middle">+</text><path d="M198 66v80q0 12 12 12h72q12 0 12-12V66" fill="#fff" stroke="#202124" stroke-width="2"/><rect x="203" y="112" width="86" height="39" rx="3" fill="#f5f6f8" stroke="none" stroke-width="1.5"/><text x="246" y="96" font-size="23" fill="#111" text-anchor="middle">25%</text><text x="246" y="141" font-size="17" fill="#111" text-anchor="middle">? g</text><path d="M316 112L370 112" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><path d="M398 66v80q0 12 12 12h72q12 0 12-12V66" fill="#fff" stroke="#202124" stroke-width="2"/><rect x="403" y="112" width="86" height="39" rx="3" fill="#f5f6f8" stroke="none" stroke-width="1.5"/><text x="446" y="96" font-size="23" fill="#111" text-anchor="middle">16%</text><text x="446" y="141" font-size="17" fill="#111" text-anchor="middle">완성</text><text x="300" y="194" font-size="15" fill="#111" text-anchor="middle">물의 증발 없음</text></g></svg>
