<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 17 600 180" role="img" aria-labelledby="title"><title id="title">시작값 7에서 현재 수가 짝수면 2로 나누고 홀수면 3배 더하기 1. 변환을 8번 반복하는 두 갈래 도식.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="300" y="30" font-size="15" fill="#111" text-anchor="middle">7에서 시작 · 정확히 8번 변환</text><rect x="215" y="62" width="170" height="49" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="300" y="93" font-size="21" fill="#111" text-anchor="middle">현재 수</text><path d="M215 87L130 144" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><path d="M385 87L470 144" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="147" width="180" height="48" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="130" y="177" font-size="20" fill="#111" text-anchor="middle">짝수 → ÷ 2</text><rect x="380" y="147" width="180" height="48" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="470" y="177" font-size="20" fill="#111" text-anchor="middle">홀수 → × 3 + 1</text></g></svg>
