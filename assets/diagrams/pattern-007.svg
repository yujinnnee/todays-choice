<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-labelledby="title"><title id="title">동시 치환 규칙 A는 AB, B는 BC, C는 A. 시작 상태 A에서 10단계 진행합니다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="45" y="15" width="160" height="80" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="125" y="43" font-size="14" fill="#111" text-anchor="middle">A</text><text x="125" y="75" font-size="22" fill="#111" text-anchor="middle">AB</text><rect x="220" y="15" width="160" height="80" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="300" y="43" font-size="14" fill="#111" text-anchor="middle">B</text><text x="300" y="75" font-size="22" fill="#111" text-anchor="middle">BC</text><rect x="395" y="15" width="160" height="80" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="475" y="43" font-size="14" fill="#111" text-anchor="middle">C</text><text x="475" y="75" font-size="22" fill="#111" text-anchor="middle">A</text><text x="300" y="140" font-size="16" fill="#111" text-anchor="middle">0단계 A → 1단계 AB → 2단계 ABBC</text></g></svg>
