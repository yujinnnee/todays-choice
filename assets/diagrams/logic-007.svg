<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-labelledby="title"><title id="title">다섯 사람 중 정직한 사람은 정확히 두 명이며 범인은 한 명입니다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="70" y="20" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="112" y="61" font-size="25" fill="#111" text-anchor="middle">A</text><rect x="164" y="20" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="206" y="61" font-size="25" fill="#111" text-anchor="middle">B</text><rect x="258" y="20" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="300" y="61" font-size="25" fill="#111" text-anchor="middle">C</text><rect x="352" y="20" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="394" y="61" font-size="25" fill="#111" text-anchor="middle">D</text><rect x="446" y="20" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="488" y="61" font-size="25" fill="#111" text-anchor="middle">E</text><text x="300" y="119" font-size="16" fill="#111" text-anchor="middle">정직한 사람 2명 · 거짓말쟁이 3명</text><text x="300" y="149" font-size="16" fill="#111" text-anchor="middle">범인은 정확히 1명</text></g></svg>
