<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 17 600 179" role="img" aria-labelledby="title"><title id="title">라벨이 사과, 배, 혼합인 세 상자. 라벨은 모두 잘못 붙었고 혼합 라벨 상자에서 사과 하나를 꺼냈습니다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="300" y="30" font-size="15" fill="#111" text-anchor="middle">세 상자의 라벨은 모두 틀림</text><rect x="164" y="59" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="206" y="100" font-size="25" fill="#111" text-anchor="middle">사과</text><rect x="258" y="59" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="300" y="100" font-size="25" fill="#111" text-anchor="middle">배</text><rect x="352" y="59" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="394" y="100" font-size="25" fill="#111" text-anchor="middle">혼합</text><path d="M395 135L395 163" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><text x="395" y="191" font-size="15" fill="#111" text-anchor="middle">사과 1개를 꺼냄</text><text x="190" y="182" font-size="16" fill="#111" text-anchor="middle">실제 내용물은 ?</text></g></svg>
