<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 27 600 193" role="img" aria-labelledby="title"><title id="title">A는 혼자 6시간, B는 혼자 9시간. 처음 2시간은 함께 일하고 그 뒤 A만 일합니다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="50" y="28" width="235" height="84" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="167.5" y="56" font-size="14" fill="#111" text-anchor="middle">A 혼자 완료</text><text x="167.5" y="88" font-size="22" fill="#111" text-anchor="middle">6시간</text><rect x="315" y="28" width="235" height="84" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="432.5" y="56" font-size="14" fill="#111" text-anchor="middle">B 혼자 완료</text><text x="432.5" y="88" font-size="22" fill="#111" text-anchor="middle">9시간</text><rect x="50" y="142" width="215" height="48" rx="12" fill="#f5f6f8" stroke="#d8dbe0" stroke-width="1.5"/><rect x="265" y="142" width="285" height="48" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="157" y="172" font-size="18" fill="#111" text-anchor="middle">함께 2시간</text><text x="407" y="172" font-size="18" fill="#111" text-anchor="middle">A 혼자 ? 시간</text><text x="50" y="215" font-size="14" fill="#111" text-anchor="start">시작</text><text x="550" y="215" font-size="14" fill="#111" text-anchor="end">완료</text></g></svg>
