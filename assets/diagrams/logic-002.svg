<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 17 600 178" role="img" aria-labelledby="title"><title id="title">왼쪽부터 1~4번 네 자리. A는 B 바로 왼쪽, C는 양 끝 제외, D는 C보다 왼쪽입니다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="117" y="62" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="159" y="103" font-size="25" fill="#111" text-anchor="middle">?</text><rect x="211" y="62" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="253" y="103" font-size="25" fill="#111" text-anchor="middle">?</text><rect x="305" y="62" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="347" y="103" font-size="25" fill="#111" text-anchor="middle">?</text><rect x="399" y="62" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="441" y="103" font-size="25" fill="#111" text-anchor="middle">?</text><text x="159" y="151" font-size="14" fill="#111" text-anchor="middle">1번</text><text x="253" y="151" font-size="14" fill="#111" text-anchor="middle">2번</text><text x="347" y="151" font-size="14" fill="#111" text-anchor="middle">3번</text><text x="441" y="151" font-size="14" fill="#111" text-anchor="middle">4번</text><text x="300" y="30" font-size="15" fill="#111" text-anchor="middle">왼쪽 → 오른쪽</text><text x="300" y="190" font-size="15" fill="#111" text-anchor="middle">A와 B는 바로 이웃 · C는 끝자리 제외</text></g></svg>
