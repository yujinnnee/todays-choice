<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 25 600 258" role="img" aria-labelledby="title"><title id="title">처음 정육면체의 전개도. 윗면 1, 아래 6, 앞 2, 뒤 5, 오른쪽 3, 왼쪽 4. 앞으로 한 번, 오른쪽으로 한 번 굴립니다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="109" y="26" width="54" height="54" rx="0" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="136" y="61" font-size="22" fill="#111" text-anchor="middle">5</text><rect x="55" y="80" width="54" height="54" rx="0" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="82" y="115" font-size="22" fill="#111" text-anchor="middle">4</text><rect x="109" y="80" width="54" height="54" rx="0" fill="#f2f3f6" stroke="#d8dbe0" stroke-width="1.5"/><text x="136" y="115" font-size="22" fill="#111" text-anchor="middle">1</text><rect x="163" y="80" width="54" height="54" rx="0" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="190" y="115" font-size="22" fill="#111" text-anchor="middle">3</text><rect x="109" y="134" width="54" height="54" rx="0" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="136" y="169" font-size="22" fill="#111" text-anchor="middle">2</text><rect x="109" y="188" width="54" height="54" rx="0" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="136" y="223" font-size="22" fill="#111" text-anchor="middle">6</text><text x="397" y="64" font-size="16" fill="#111" text-anchor="middle">처음: 윗면 1 / 앞면 2</text><text x="397" y="111" font-size="18" fill="#111" text-anchor="middle">앞쪽으로 1번</text><path d="M397 126L397 157" fill="none" stroke="#202124" stroke-width="2" marker-end="url(#arrow)"/><text x="397" y="184" font-size="18" fill="#111" text-anchor="middle">오른쪽으로 1번</text><text x="300" y="278" font-size="15" fill="#111" text-anchor="middle">왼쪽 그림은 처음 상태의 전개도입니다.</text></g></svg>
