<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 17 600 136" role="img" aria-labelledby="title"><title id="title">보이는 카드 네 장의 면은 A, D, 4, 7이며 반대쪽 면은 숨겨져 있습니다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="300" y="30" font-size="15" fill="#111" text-anchor="middle">카드의 보이는 면</text><rect x="117" y="52" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="159" y="93" font-size="25" fill="#111" text-anchor="middle">A</text><rect x="211" y="52" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="253" y="93" font-size="25" fill="#111" text-anchor="middle">D</text><rect x="305" y="52" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="347" y="93" font-size="25" fill="#111" text-anchor="middle">4</text><rect x="399" y="52" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="441" y="93" font-size="25" fill="#111" text-anchor="middle">7</text><text x="300" y="148" font-size="16" fill="#111" text-anchor="middle">각 카드의 반대쪽 면은 보이지 않음</text></g></svg>
