<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 17 600 178" role="img" aria-labelledby="title"><title id="title">서로 독립적인 주사위 두 개. 적어도 하나가 6이라는 조건에서 합이 9일 확률을 구합니다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="300" y="30" font-size="15" fill="#111" text-anchor="middle">적어도 하나의 주사위가 6</text><rect x="160" y="57" width="100" height="100" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="210" y="125" font-size="47" fill="#111" text-anchor="middle">?</text><text x="300" y="118" font-size="24" fill="#111" text-anchor="middle">+</text><rect x="340" y="57" width="100" height="100" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="390" y="125" font-size="47" fill="#111" text-anchor="middle">?</text><text x="300" y="190" font-size="15" fill="#111" text-anchor="middle">두 눈의 합이 9일 확률은?</text></g></svg>
