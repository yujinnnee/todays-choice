<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" role="img" aria-labelledby="title"><title id="title">빨간 공 5개, 파란 공 4개, 초록 공 3개 중 3개를 뽑습니다. 빨간 공이 적어도 하나 있습니다.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="45" y="20" width="160" height="80" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="125" y="48" font-size="14" fill="#111" text-anchor="middle">빨간 공</text><text x="125" y="80" font-size="22" fill="#111" text-anchor="middle">5개</text><rect x="220" y="20" width="160" height="80" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="300" y="48" font-size="14" fill="#111" text-anchor="middle">파란 공</text><text x="300" y="80" font-size="22" fill="#111" text-anchor="middle">4개</text><rect x="395" y="20" width="160" height="80" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="475" y="48" font-size="14" fill="#111" text-anchor="middle">초록 공</text><text x="475" y="80" font-size="22" fill="#111" text-anchor="middle">3개</text><text x="300" y="145" font-size="16" fill="#111" text-anchor="middle">3개 추출 · 빨간 공이 적어도 1개</text><text x="300" y="177" font-size="16" fill="#111" text-anchor="middle">정확히 두 종류의 색일 확률은?</text></g></svg>
