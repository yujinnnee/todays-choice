<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 30 600 140" role="img" aria-labelledby="title"><title id="title">1부터 40까지의 범위에서 3의 배수 또는 숫자 3을 포함하면 박수를 한 번 치는 규칙.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#202124"/></marker></defs><g font-family="Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><rect x="117" y="31" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="159" y="72" font-size="25" fill="#111" text-anchor="middle">1</text><rect x="211" y="31" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="253" y="72" font-size="25" fill="#111" text-anchor="middle">2</text><rect x="305" y="31" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="347" y="72" font-size="25" fill="#111" text-anchor="middle">…</text><rect x="399" y="31" width="84" height="64" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="441" y="72" font-size="25" fill="#111" text-anchor="middle">40</text><rect x="60" y="125" width="214" height="43" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="167" y="152" font-size="17" fill="#111" text-anchor="middle">3의 배수</text><text x="300" y="152" font-size="15" fill="#111" text-anchor="middle">또는</text><rect x="327" y="125" width="214" height="43" rx="12" fill="#fff" stroke="#d8dbe0" stroke-width="1.5"/><text x="434" y="152" font-size="17" fill="#111" text-anchor="middle">숫자 3을 포함</text></g></svg>
